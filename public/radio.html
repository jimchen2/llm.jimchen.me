<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Российские радиостанции — онлайн</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel-2:#20242d;--border:#2a2f3a;--text:#e8eaf0;--muted:#8a92a3;--accent:#ff6b35;--accent-2:#ffb24d;--ok:#3ecf8e;--bad:#ef5b5b}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:160px}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:18px 24px 14px}
.title-row{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}h1 span{color:var(--accent)}
.status-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.count{color:var(--muted);font-size:14px}
.recheck-btn{background:var(--panel);border:1px solid var(--border);color:var(--muted);border-radius:8px;padding:5px 10px;font-size:12px;font-family:inherit;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.recheck-btn:hover:not(:disabled){border-color:#3a4150;color:var(--text);background:var(--panel-2)}
.recheck-btn:disabled{opacity:.55;cursor:default}
.controls{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
.search{flex:1 1 260px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:15px;outline:none}.search:focus{border-color:var(--accent)}
.custom{display:flex;gap:8px;flex:2 1 420px}.custom input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none}.custom input:focus{border-color:var(--accent)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.08)}
main{padding:20px 24px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}
.divider{grid-column:1/-1;display:flex;align-items:center;gap:12px;margin:10px 0 2px;color:var(--muted);font-size:12px;letter-spacing:.2px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
.divider::before{flex:0 0 16px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s,opacity .25s;cursor:pointer;user-select:none;color:inherit;font:inherit;text-align:left}
.card:hover{border-color:#3a4150;background:var(--panel-2)}
.card.active{border-color:var(--accent);background:var(--panel-2)}
.card.off{opacity:.42;background:rgba(24,27,34,.55);border-color:rgba(42,47,58,.75)}
.card.off:hover{opacity:.66;border-color:#3a4150;background:var(--panel)}
.card.off.no-url{cursor:not-allowed}
.card.off.no-url:hover{opacity:.42;border-color:rgba(42,47,58,.75);background:rgba(24,27,34,.55)}
.play-ico{flex:0 0 44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:16px}
.card.off .play-ico{background:var(--border);color:var(--muted)}
.info{min-width:0;flex:1}
.name{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card.off .name{color:var(--muted)}
.meta{margin-top:4px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{background:#262b36;border-radius:6px;padding:2px 7px;color:#b5bccb}
.tag-off{background:rgba(239,91,91,.13);border-radius:6px;padding:2px 7px;color:#df8b8b}
.eq{display:none;gap:2px;align-items:flex-end;height:14px;margin-left:auto}.card.active.playing .eq{display:inline-flex}.eq i{display:block;width:3px;background:var(--accent);border-radius:2px;animation:eq 1s infinite ease-in-out}.eq i:nth-child(1){height:60%;animation-delay:-.2s}.eq i:nth-child(2){height:100%;animation-delay:-.5s}.eq i:nth-child(3){height:40%;animation-delay:-.8s}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(24,27,34,.97);border-top:1px solid var(--border);backdrop-filter:blur(8px);display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}.player .now{flex:1 1 260px;min-width:0}.player .now .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .now .s{font-size:12px;color:var(--muted);margin-top:3px}.player .s.ok{color:var(--ok)}.player .s.err{color:var(--bad)}.toggle{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:#fff;font-size:20px;display:grid;place-items:center;flex:0 0 auto}.toggle:disabled{background:var(--border);cursor:default}
@media(max-width:560px){header,main{padding-left:14px;padding-right:14px}.player{padding:12px 14px}}

const $=id=>document.getElementById(id);
const audio=$('audio'),grid=$('grid'),search=$('search'),countEl=$('count'),recheckBtn=$('recheckBtn'),toggle=$('toggle'),nowTitle=$('nowTitle'),nowStatus=$('nowStatus'),customUrl=$('customUrl'),customBtn=$('customBtn');

let currentIdx=null,current=null,requestId=0;
let hls=null,hlsLibPromise=null;
let probeRunId=0,isProbing=false;

const PROBE_CONCURRENCY=8;
const PROBE_TIMEOUT_MS=7000;
const MIXED_AUDIO_TIMEOUT_MS=4500;

function isHls(url){return /\.m3u8($|\?)/i.test(url||'');}
function destroyHls(){if(hls){try{hls.destroy();}catch(e){}hls=null;}}
function loadHlsLib(){
  if(window.Hls)return Promise.resolve();
  if(!hlsLibPromise){
    hlsLibPromise=new Promise((res,rej)=>{
      const sc=document.createElement('script');
      sc.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';
      sc.onload=res;
      sc.onerror=rej;
      document.head.append(sc);
    });
  }
  return hlsLibPromise;
}
function setStatus(text,cls){nowStatus.textContent=text;nowStatus.className='s'+(cls?' '+cls:'');}
function markActive(){
  grid.querySelectorAll('.card').forEach(c=>{
    const active=currentIdx!==null&&Number(c.dataset.idx)===currentIdx;
    c.classList.toggle('active',active);
    c.classList.toggle('playing',active&&!audio.paused);
  });
}

function updateCount(){
  const total=STATIONS.length;
  const offCount=STATIONS.filter(s=>s.status==='off').length;
  const availCount=total-offCount;
  const checkable=STATIONS.filter(s=>s.u);
  const doneCount=checkable.filter(s=>s.status!=='checking').length;
  if(isProbing&&doneCount<checkable.length){
    countEl.textContent=`Доступно: ${availCount} из ${total} · проверка ${doneCount}/${checkable.length}…`;
  }else if(offCount>0){
    countEl.textContent=`Доступно: ${availCount} из ${total} · недоступно: ${offCount}`;
  }else{
    countEl.textContent=`Доступно: ${availCount} из ${total}`;
  }
  recheckBtn.disabled=isProbing;
}

function makeCard(s){
  const isOff=s.status==='off';
  const card=document.createElement('button');
  card.type='button';
  card.className='card'+(isOff?' off':'')+(s.u?'':' no-url');
  card.disabled=!s.u;
  card.dataset.idx=s.idx;
  if(isOff&&s.u)card.title='Станция недоступна при проверке — нажмите, чтобы попробовать снова';

  const ico=document.createElement('span');
  ico.className='play-ico';
  ico.textContent=(s.u&&!isOff)?'▶':'✕';
  ico.setAttribute('aria-hidden','true');

  const info=document.createElement('span');
  info.className='info';
  const name=document.createElement('span');
  name.className='name';
  name.textContent=s.n;

  const meta=document.createElement('span');
  meta.className='meta';
  const tag=document.createElement('span');
  tag.className='tag';
  tag.textContent=s.r;
  meta.append(tag);

  if(!s.u){
    const off=document.createElement('span');
    off.className='tag-off';
    off.textContent='поток не найден';
    meta.append(off);
  }else if(isOff){
    const off=document.createElement('span');
    off.className='tag-off';
    off.textContent='недоступна';
    meta.append(off);
  }
  info.append(name,meta);

  const eq=document.createElement('span');
  eq.className='eq';
  eq.innerHTML='<i></i><i></i><i></i>';
  eq.setAttribute('aria-hidden','true');

  card.append(ico,info,eq);
  if(s.u)card.addEventListener('click',()=>playStation(s,s.idx));
  return card;
}

function renderList(){
  const activeFocus=document.activeElement&&document.activeElement.closest('#grid')?document.activeElement.dataset.idx:null;
  const q=search.value.trim().toLowerCase();
  grid.replaceChildren();

  const matches=STATIONS.filter(s=>!q||s.n.toLowerCase().includes(q)||s.r.toLowerCase().includes(q));
  const avail=matches.filter(s=>s.status!=='off');
  const unavail=matches.filter(s=>s.status==='off');

  avail.forEach(s=>grid.append(makeCard(s)));
  if(avail.length>0&&unavail.length>0){
    const div=document.createElement('div');
    div.className='divider';
    div.textContent=`Недоступные станции (${unavail.length})`;
    grid.append(div);
  }
  unavail.forEach(s=>grid.append(makeCard(s)));

  if(!matches.length){
    const e=document.createElement('div');
    e.className='empty';
    e.textContent='Ничего не найдено';
    grid.append(e);
  }

  updateCount();
  markActive();

  if(activeFocus!==null){
    const el=grid.querySelector(`.card[data-idx="${activeFocus}"]`);
    if(el)el.focus({preventScroll:true});
  }
}

function setStationStatus(s,newStatus){
  if(!s||!s.u||s.status===newStatus)return;
  const prev=s.status;
  s.status=newStatus;
  if(prev==='off'||newStatus==='off'){
    renderList();
  }else{
    updateCount();
  }
}

async function probeFetchHeaders(url,mode,timeoutMs){
  const ctrl=new AbortController();
  let timedOut=false;
  const timer=setTimeout(()=>{timedOut=true;ctrl.abort();},timeoutMs);
  try{
    const res=await fetch(url,{mode,cache:'no-store',signal:ctrl.signal});
    const isOpaque=res.type==='opaque';
    const ok=isOpaque?true:res.ok;
    const ct=isOpaque?'':(res.headers.get('content-type')||'').toLowerCase();
    try{if(res.body)res.body.cancel().catch(()=>{});}catch(e){}
    ctrl.abort();
    if(!ok)return 'fail';
    if(ct&&/^(text\/html|application\/xhtml\+xml|application\/json|application\/xml)/i.test(ct))return 'fail';
    return 'ok';
  }catch(e){
    return timedOut?'fail':'unknown';
  }finally{
    clearTimeout(timer);
  }
}

async function fetchTextWithTimeout(url,timeoutMs){
  const ctrl=new AbortController();
  let timedOut=false;
  const timer=setTimeout(()=>{timedOut=true;ctrl.abort();},timeoutMs);
  try{
    const res=await fetch(url,{mode:'cors',cache:'no-store',signal:ctrl.signal});
    if(!res.ok)return {state:'fail'};
    const text=await res.text();
    return {state:'ok',text,finalUrl:res.url||url};
  }catch(e){
    return {state:timedOut?'fail':'unknown'};
  }finally{
    clearTimeout(timer);
  }
}

function probeAudioElement(url,timeoutMs){
  return new Promise(resolve=>{
    const a=document.createElement('audio');
    a.muted=true;
    a.preload='auto';
    let done=false;
    let suspendTimer=null;
    const finish=result=>{
      if(done)return;
      done=true;
      clearTimeout(timer);
      if(suspendTimer)clearTimeout(suspendTimer);
      a.removeEventListener('loadedmetadata',onOk);
      a.removeEventListener('loadeddata',onOk);
      a.removeEventListener('canplay',onOk);
      a.removeEventListener('error',onErr);
      a.removeEventListener('suspend',onSuspend);
      try{a.pause();a.removeAttribute('src');a.load();}catch(e){}
      resolve(result);
    };
    const onOk=()=>finish('ok');
    const onErr=()=>finish('fail');
    const onSuspend=()=>{
      if(a.readyState===0&&a.networkState===1&&!suspendTimer){
        suspendTimer=setTimeout(()=>{
          if(!done&&a.readyState===0&&a.networkState===1)finish('suspended');
          suspendTimer=null;
        },250);
      }
    };
    const timer=setTimeout(()=>finish('fail'),timeoutMs);
    a.addEventListener('loadedmetadata',onOk,{once:true});
    a.addEventListener('loadeddata',onOk,{once:true});
    a.addEventListener('canplay',onOk,{once:true});
    a.addEventListener('error',onErr,{once:true});
    a.addEventListener('suspend',onSuspend);
    a.src=url;
    a.load();
  });
}

async function probeAudioWithFallback(url,timeoutMs){
  const start=Date.now();
  const corsRes=await probeFetchHeaders(url,'cors',timeoutMs);
  if(corsRes==='ok')return 'ok';
  if(corsRes==='fail')return 'fail';

  const isMixed=location.protocol==='https:'&&/^http:\/\//i.test(url);
  const elapsed=Date.now()-start;
  const rem=Math.max(1500,timeoutMs-elapsed);
  const audioTimeout=isMixed?Math.min(rem,MIXED_AUDIO_TIMEOUT_MS):rem;

  const audioRes=await probeAudioElement(url,audioTimeout);
  if(audioRes==='ok')return 'ok';
  if(audioRes==='fail')return 'fail';

  const noCorsRes=await probeFetchHeaders(url,'no-cors',Math.max(2500,rem));
  return noCorsRes==='ok'?'ok':'fail';
}

async function probeHls(url,timeoutMs){
  const start=Date.now();
  const rem=()=>Math.max(1500,timeoutMs-(Date.now()-start));
  const r1=await fetchTextWithTimeout(url,timeoutMs);
  if(r1.state==='fail')return 'fail';
  if(r1.state==='unknown'){
    if(!audio.canPlayType('application/vnd.apple.mpegurl'))return 'fail';
    return probeAudioWithFallback(url,rem());
  }
  if(!r1.text.includes('#EXTM3U'))return 'fail';

  let mediaText=r1.text;
  let mediaUrl=r1.finalUrl;
  if(/#EXT-X-STREAM-INF/i.test(mediaText)){
    const variant=mediaText.split(/\r?\n/).map(l=>l.trim()).find(l=>l&&!l.startsWith('#'));
    if(!variant)return 'fail';
    const variantUrl=new URL(variant,mediaUrl).href;
    const r2=await fetchTextWithTimeout(variantUrl,rem());
    if(r2.state!=='ok'||!r2.text.includes('#EXTM3U'))return 'fail';
    mediaText=r2.text;
    mediaUrl=r2.finalUrl;
  }

  const lines=mediaText.split(/\r?\n/).map(l=>l.trim()).filter(l=>l&&!l.startsWith('#'));
  if(!lines.length)return 'fail';
  const segUrl=new URL(lines[lines.length-1],mediaUrl).href;
  const segRes=await probeFetchHeaders(segUrl,'cors',rem());
  return segRes==='ok'?'ok':'fail';
}

async function probeStation(s){
  if(!s.u)return 'off';
  const res=isHls(s.u)?await probeHls(s.u,PROBE_TIMEOUT_MS):await probeAudioWithFallback(s.u,PROBE_TIMEOUT_MS);
  return res==='ok'?'ok':'off';
}

async function probeAll(){
  const runId=++probeRunId;
  isProbing=true;
  STATIONS.forEach(s=>{if(s.u)s.status='checking';});
  renderList();

  const queue=STATIONS.filter(s=>s.u);
  let cursor=0;

  async function worker(){
    while(cursor<queue.length){
      if(runId!==probeRunId)return;
      const s=queue[cursor++];
      const res=await probeStation(s);
      if(runId!==probeRunId)return;
      setStationStatus(s,res);
    }
  }

  const workers=Array.from({length:Math.min(PROBE_CONCURRENCY,queue.length)},()=>worker());
  await Promise.all(workers);

  if(runId===probeRunId){
    isProbing=false;
    updateCount();
  }
}

function startStream(){
  const id=++requestId;
  const activeIdx=currentIdx;
  const activeStation=current;
  setStatus('Подключение…');
  destroyHls();

  const fail=err=>{
    if(id!==requestId)return;
    if(err&&(err.name==='AbortError'||err.name==='NotAllowedError'))return;
    setStatus('Не удалось воспроизвести поток','err');
    toggle.textContent='▶';
    if(activeIdx!==null&&activeStation===STATIONS[activeIdx])setStationStatus(activeStation,'off');
    markActive();
  };

  if(isHls(current.u)&&!audio.canPlayType('application/vnd.apple.mpegurl')){
    loadHlsLib().then(()=>{
      if(id!==requestId)return;
      if(!window.Hls||!Hls.isSupported()){fail();return;}
      hls=new Hls({enableWorker:true});
      hls.on(Hls.Events.ERROR,(_,d)=>{if(d&&d.fatal)fail();});
      hls.loadSource(current.u);
      hls.attachMedia(audio);
      hls.on(Hls.Events.MANIFEST_PARSED,()=>{audio.play().catch(fail);});
    }).catch(fail);
    return;
  }

  audio.src=current.u;
  audio.play().catch(fail);
}

function playStation(s,idx){
  if(!s||!s.u)return;
  if(current===s&&!audio.paused){audio.pause();return;}
  current=s;
  currentIdx=idx===undefined?null:idx;
  nowTitle.textContent=s.n;
  toggle.disabled=false;
  startStream();
  markActive();
}

toggle.addEventListener('click',()=>{
  if(!current)return;
  if(audio.paused)startStream();
  else audio.pause();
});

audio.addEventListener('playing',()=>{
  setStatus('В эфире','ok');
  toggle.textContent='⏸';
  if(currentIdx!==null&&current===STATIONS[currentIdx])setStationStatus(current,'ok');
  markActive();
});
audio.addEventListener('waiting',()=>setStatus('Буферизация…'));
audio.addEventListener('pause',()=>{if(current)setStatus('Пауза');toggle.textContent='▶';markActive();});
audio.addEventListener('error',()=>{
  if(!current)return;
  if(audio.error&&audio.error.code===1)return;
  setStatus('Ошибка потока: станция недоступна или ссылка устарела','err');
  toggle.textContent='▶';
  if(currentIdx!==null&&current===STATIONS[currentIdx])setStationStatus(current,'off');
  markActive();
});
audio.addEventListener('ended',()=>{setStatus('Поток завершён','err');toggle.textContent='▶';markActive();});

search.addEventListener('input',renderList);
recheckBtn.addEventListener('click',()=>probeAll());

customBtn.addEventListener('click',()=>{
  let url;
  try{
    url=new URL(customUrl.value.trim());
    if(!['http:','https:'].includes(url.protocol))throw new Error();
  }catch{
    setStatus('Введите корректную ссылку, начинающуюся с http:// или https://','err');
    return;
  }
  playStation({n:'Свой поток',r:'вручную',u:url.href});
});
customUrl.addEventListener('keydown',e=>{if(e.key==='Enter')customBtn.click();});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'&&!e.repeat&&!e.target.closest('input,textarea,select,button,[contenteditable]')&&!toggle.disabled){
    e.preventDefault();
    toggle.click();
  }
});

renderList();
probeAll();
</script>
</body>
</html>
