<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Российские радиостанции — онлайн</title>
<style>
:root{--bg:#0f1115;--panel:#181b22;--panel-2:#20242d;--border:#2a2f3a;--text:#e8eaf0;--muted:#8a92a3;--accent:#ff6b35;--accent-2:#ffb24d;--ok:#3ecf8e;--bad:#ef5b5b}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh;padding-bottom:160px}
header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:18px 24px 14px}.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}h1 span{color:var(--accent)}.count{color:var(--muted);font-size:14px}.controls{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}.search{flex:1 1 260px;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:15px;outline:none}.search:focus{border-color:var(--accent)}.custom{display:flex;gap:8px;flex:2 1 420px}.custom input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:14px;outline:none}.custom input:focus{border-color:var(--accent)}.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}.btn:hover{filter:brightness(1.08)}
main{padding:20px 24px}.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr))}.card{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;transition:border-color .15s,background .15s;cursor:pointer;user-select:none;color:inherit;font:inherit;text-align:left}.card:hover{border-color:#3a4150;background:var(--panel-2)}.card.active{border-color:var(--accent);background:var(--panel-2)}.card.off{opacity:.45;cursor:not-allowed}.card.off:hover{border-color:var(--border);background:var(--panel)}.card.dead{opacity:.42;filter:saturate(.3)}.card.dead:hover{opacity:.72;border-color:#3a4150;background:var(--panel-2)}.card.dead .play-ico{background:var(--border)}.flag{color:var(--bad);font-size:11px;text-transform:lowercase}.count-wrap{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.linkbtn{background:none;border:0;padding:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;white-space:nowrap}.linkbtn:hover{color:var(--accent)}.linkbtn:disabled{opacity:.45;cursor:default;text-decoration:none}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle;animation:pulse 1s infinite ease-in-out}@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}.play-ico{flex:0 0 44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));display:grid;place-items:center;color:#fff;font-size:16px}.card.off .play-ico{background:var(--border)}.info{min-width:0;flex:1}.name{font-size:15px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}.meta{margin-top:4px;font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}.tag{background:#262b36;border-radius:6px;padding:2px 7px;color:#b5bccb}.eq{display:none;gap:2px;align-items:flex-end;height:14px;margin-left:auto}.card.active.playing .eq{display:inline-flex}.eq i{display:block;width:3px;background:var(--accent);border-radius:2px;animation:eq 1s infinite ease-in-out}.eq i:nth-child(1){height:60%;animation-delay:-.2s}.eq i:nth-child(2){height:100%;animation-delay:-.5s}.eq i:nth-child(3){height:40%;animation-delay:-.8s}@keyframes eq{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}.empty{color:var(--muted);padding:40px 0;text-align:center;grid-column:1/-1}
.player{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(24,27,34,.97);border-top:1px solid var(--border);backdrop-filter:blur(8px);display:flex;align-items:center;gap:16px;padding:14px 24px;flex-wrap:wrap}.player .now{flex:1 1 260px;min-width:0}.player .now .t{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player .now .s{font-size:12px;color:var(--muted);margin-top:3px}.player .s.ok{color:var(--ok)}.player .s.err{color:var(--bad)}.toggle{width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;background:var(--accent);color:#fff;font-size:20px;display:grid;place-items:center;flex:0 0 auto}.toggle:disabled{background:var(--border);cursor:default}@media(max-width:560px){header,main{padding-left:14px;padding-right:14px}.player{padding:12px 14px}}
</style>
</head>
<body>
<header><div class="title-row"><h1><span>●</span> Российские радиостанции</h1><div class="count-wrap"><div class="count" id="count"></div><button class="linkbtn" id="recheck" type="button">Проверить снова</button></div></div><div class="controls"><input class="search" id="search" type="search" aria-label="Поиск по названию или городу" placeholder="Поиск по названию или городу…"><div class="custom"><input id="customUrl" type="url" aria-label="Свой поток" placeholder="Свой поток: вставьте ссылку на аудиопоток (mp3/aac)"><button class="btn" id="customBtn">Слушать</button></div></div></header>
<main><div class="grid" id="grid"></div></main>
<div class="player"><div class="now"><div class="t" id="nowTitle">Выберите станцию</div><div class="s" id="nowStatus" role="status">Нажмите на карточку, чтобы начать прослушивание</div></div><button class="toggle" id="toggle" disabled aria-label="Пуск/пауза">▶</button></div>
<audio id="audio" preload="none"></audio>
<script>
const STATIONS = [
['Говорит Москва','Москва','https://media.govoritmoskva.ru/ru64.mp3'],

['Бизнес FM','Москва','https://bfm.hostingradio.ru:9075/fm'],
['Москва FM','Москва','https://icecast-vgtrk.cdnvideo.ru/moscowfm128'],
['Радонеж','Москва','https://icecast-radonezh.cdnvideo.ru/rad128'],
['Радиокнига','Москва','https://bookradio.hostingradio.ru:8069/fm'],
['Радио Спутник. Россия Сегодня','Москва','https://icecast-rian.cdnvideo.ru/voicerus'],
['Радио Москвы','Москва','https://icecast-vgtrk.cdnvideo.ru/moscowtalk128'],
['Радио Фантастики','Москва','https://listen9.myradio24.com/55699'],
['Радио Вера','Москва','http://77.39.8.49:8000/vera_air_96'],
['Davidzon Radio','США (Нью-Джерси)','http://radioserver.abinet.com:8800/dr.aac'],
['Радио России (Нижний Новгород)','Нижний Новгород','https://icecast-vgtrk.cdnvideo.ru/russiafm_nn'],
['Старое радио','Москва','http://195.91.237.50:8000/ices128'],
['Радио Маяк (Нижний Новгород)','Нижний Новгород','https://icecast-vgtrk.cdnvideo.ru/mayak_nn'],
['Радио России (Санкт-Петербург)','Санкт-Петербург','https://radio.rtr.spb.ru/live1'],
['Благовещение','Москва','https://radio-blagoveshchenie.ru:10005/stream'],
['Модель для сборки','Москва','http://mds-station.com:8000/mds'],
['Радио Зенит','Санкт-Петербург','https://radiozenit.hostingradio.ru/radiozenit256.mp3'],
['Радио России (Пермь)','Пермь','https://podcast-gtrk.smotrim.ru/vgtrk/perm/radio_russia/index.m3u8'],
['Маяк (Самара)','Самара','https://podcast-gtrk.smotrim.ru/vgtrk/samara/mayak/index.m3u8'],
['Радио России (Самара)','Самара','https://podcast-gtrk.smotrim.ru/vgtrk/samara/radio_russia/index.m3u8'],
['Бизнес FM (Санкт-Петербург)','Санкт-Петербург','https://bfmreg.hostingradio.ru/spb.bfm128.mp3'],
['Маяк (Барнаул)','Барнаул','http://gtrk22.ru:8000/mayak22'],
['Радио Всероссийского общества слепых (ВОС)','Москва','http://radiovos.ru:9000/radiovos-128'],
['Радио Справедливая Россия','Москва','https://spravedlivo.hostingradio.ru:8022/spravedlivo128.mp3'],
['Комсомольская Правда (Санкт-Петербург)','Санкт-Петербург','https://kpradio.hostingradio.ru:8000/spb.radiokp128.mp3'],
['Комсомольская Правда (Новосибирск)','Новосибирск','https://kpradio.hostingradio.ru:8000/novosibirsk.radiokp128.mp3'],
['Радио Музком','Москва','https://geshou.s02.radio-tochka.com:5005/stream'],
['Радио России (Иваново)','Иваново','https://podcast-gtrk.smotrim.ru/vgtrk/ivanovo/radio_russia/index.m3u8'],
['Радио Воскресенье','Екатеринбург','http://217.24.181.164:8000/stream.mp3'],
['Бизнес FM (Нижний Новгород)','Нижний Новгород','https://online-2.gkvr.ru:8000/bfm_nno_64.aac'],
['Коммерсантъ FM (Нижний Новгород)','Нижний Новгород','https://kommersant77.hostingradio.ru:8085/kommersant128.mp3'],
['Комсомольская правда (Екатеринбург)','Екатеринбург','https://kpradio.hostingradio.ru:8000/ekaterinburg.radiokp128.mp3'],
['Радио России (Пенза)','Пенза','https://icecast-vgtrk.cdnvideo.ru/rr_penza_aac']
].map(([n,r,u])=>({n,r,u}));
const $=id=>document.getElementById(id);
const audio=$('audio'),grid=$('grid'),search=$('search'),countEl=$('count'),toggle=$('toggle'),nowTitle=$('nowTitle'),nowStatus=$('nowStatus'),customUrl=$('customUrl'),customBtn=$('customBtn'),recheck=$('recheck');
let currentIdx=null,current=null,requestId=0;
let hls=null,hlsLibPromise=null;
function isHls(url){return /\.m3u8($|\?)/i.test(url||'');}
function destroyHls(){if(hls){try{hls.destroy();}catch(e){}hls=null;}}
function loadHlsLib(){if(window.Hls)return Promise.resolve();if(!hlsLibPromise){hlsLibPromise=new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js';sc.onload=res;sc.onerror=rej;document.head.append(sc);});}return hlsLibPromise;}
function setStatus(text,cls){nowStatus.textContent=text;nowStatus.className='s'+(cls?' '+cls:'');}

/* ---------- availability ---------------------------------------------------
   Every stream is pinged once when the page loads (no polling — refreshing the
   page re-checks). Streams that do not answer are dampened and sink to the
   bottom of the list; the ones that answer keep their original order.        */
const status=new Map();            // url -> {state:'ok'|'bad',reason,httpStatus}
const securePage=location.protocol==='https:';
const check={running:false,done:0,total:0,error:null};
let renderTimer=null;

// An https page cannot play an http stream at all (mixed content), so those are
// marked unavailable up front and never probed.
STATIONS.forEach(s=>{s.mixed=securePage&&/^http:\/\//i.test(s.u||'');});
function statusOf(s){
  if(!s||!s.u)return {state:'bad',reason:'missing'};
  if(s.mixed)return {state:'bad',reason:'mixed'};
  return status.get(s.u)||{state:'unknown'};
}
const isBad=s=>statusOf(s).state==='bad';
function reasonLabel(st){
  return 'недоступно';
}
// Longer explanation for the hover tooltip on a dampened card.
function reasonHint(st){
  if(st.reason==='mixed')return 'Станция вещает только по http — на https-странице браузер блокирует такой поток';
  if(st.reason==='timeout')return 'Поток не ответил на проверку — возможно, он временно недоступен';
  if(st.reason==='playback')return 'Поток не воспроизвёлся — возможно, ссылка устарела';
  return 'Поток сейчас не отвечает — включить можно, но, скорее всего, не получится';
}
function markBad(s,reason){if(!s||!s.u)return;const cur=statusOf(s);if(cur.state==='bad'&&cur.reason===reason)return;status.set(s.u,{state:'bad',reason});scheduleRender();}
function markOk(s){if(!s||!s.u)return;if(statusOf(s).state==='ok')return;status.set(s.u,{state:'ok'});scheduleRender();}
function scheduleRender(){if(renderTimer)return;renderTimer=setTimeout(()=>{renderTimer=null;renderList();},120);}

function markActive(){grid.querySelectorAll('.card').forEach(c=>{const active=currentIdx!==null&&Number(c.dataset.idx)===currentIdx;c.classList.toggle('active',active);c.classList.toggle('playing',active&&!audio.paused);});}

function makeCard(s,i){
  const st=statusOf(s),dead=st.state==='bad',playable=!!s.u;
  const card=document.createElement('button');
  card.type='button';
  card.className=playable?('card'+(dead?' dead':'')):'card off';
  card.disabled=!playable;
  card.dataset.idx=i;
  if(dead&&playable)card.title=reasonHint(st);
  const ico=document.createElement('span');
  ico.className='play-ico';ico.textContent=playable?'▶':'✕';ico.setAttribute('aria-hidden','true');
  const info=document.createElement('span');info.className='info';
  const name=document.createElement('span');name.className='name';name.textContent=s.n;
  const meta=document.createElement('span');meta.className='meta';
  const tag=document.createElement('span');tag.className='tag';tag.textContent=s.r;meta.append(tag);
  if(!playable){const off=document.createElement('span');off.textContent='поток не найден';meta.append(off);}
  else if(dead){const flag=document.createElement('span');flag.className='flag';flag.textContent=reasonLabel(st);meta.append(flag);}
  info.append(name,meta);
  const eq=document.createElement('span');eq.className='eq';eq.innerHTML='<i></i><i></i><i></i>';eq.setAttribute('aria-hidden','true');
  card.append(ico,info,eq);
  if(playable)card.addEventListener('click',()=>playStation(s,i));
  return card;
}

function updateCount(){
  recheck.disabled=check.running;
  if(check.running){countEl.innerHTML='<span class="dot"></span>Проверка потоков… '+check.done+'/'+check.total;return;}
  const total=STATIONS.length,bad=STATIONS.filter(isBad).length;
  const text='Доступно: '+(total-bad)+' из '+total;
  countEl.textContent=check.error?text+' · проверка не удалась':text;
}

function renderList(){
  const q=search.value.trim().toLowerCase();
  const items=[];
  STATIONS.forEach((s,i)=>{if(q&&!(s.n.toLowerCase().includes(q)||s.r.toLowerCase().includes(q)))return;items.push({s,i});});
  // Stable: streams that answered first, dampened ones at the bottom.
  items.sort((a,b)=>(isBad(a.s)?1:0)-(isBad(b.s)?1:0)||a.i-b.i);
  grid.replaceChildren();
  if(!items.length){const e=document.createElement('div');e.className='empty';e.textContent='Ничего не найдено';grid.append(e);}
  else for(const item of items) grid.append(makeCard(item.s,item.i));
  updateCount();
  markActive();
}

/* ---------- one ping per stream, on load ---------------------------------- */
async function checkAll(opts){
  const force=!!(opts&&opts.force);
  if(check.running)return;
  const urls=[];
  STATIONS.forEach(s=>{if(s.u&&!s.mixed&&urls.indexOf(s.u)===-1)urls.push(s.u);});
  if(!urls.length)return;
  check.running=true;check.done=0;check.total=urls.length;check.error=null;
  scheduleRender();
  const record=(url,ok,extra)=>{
    if(!url)return;
    if(ok)status.set(url,{state:'ok'});
    else status.set(url,{state:'bad',reason:(extra&&extra.error==='timeout')?'timeout':'http',httpStatus:extra&&extra.status});
    check.done++;
    scheduleRender();
  };
  try{
    await streamCheck(urls,force,record);
  }catch(err){
    console.warn('[radio] server-side check unavailable, probing from the browser instead',err);
    check.done=0;
    try{await browserProbeAll(urls,record);}catch(err2){check.error=String((err2&&err2.message)||err2);}
  }finally{
    check.running=false;
    renderList();
  }
}

// The server probes the streams and streams back NDJSON, one verdict per line.
async function streamCheck(urls,force,record){
  const res=await fetch('/api/radio/check'+(force?'?force=1':''),{
    method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({urls})
  });
  if(!res.ok||!res.body)throw new Error('HTTP '+res.status);
  const reader=res.body.getReader(),decoder=new TextDecoder();
  let buf='',finished=false;
  const handle=line=>{
    if(!line.trim())return;
    let msg;
    try{msg=JSON.parse(line);}catch(e){return;}
    if(msg.done){finished=true;return;}
    if(msg.url)record(msg.url,!!msg.ok,msg);
  };
  while(!finished){
    const chunk=await reader.read();
    if(chunk.done)break;
    buf+=decoder.decode(chunk.value,{stream:true});
    let nl;
    while((nl=buf.indexOf('\n'))!==-1){
      const line=buf.slice(0,nl);
      buf=buf.slice(nl+1);
      handle(line);
      if(finished)break;
    }
  }
  if(!finished){buf+=decoder.decode();handle(buf);}
  try{await reader.cancel();}catch(e){}
}

// Fallback for when the check endpoint is not there (e.g. radio.html served on
// its own): an opaque no-cors request still tells a dead host from a live one.
async function browserProbeAll(urls,record){
  let next=0;
  const worker=async()=>{
    while(next<urls.length){
      const url=urls[next++];
      record(url,await browserProbe(url),{error:'browser'});
    }
  };
  const workers=[];
  for(let k=0;k<Math.min(6,urls.length);k++)workers.push(worker());
  await Promise.all(workers);
}
async function browserProbe(url){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),7000);
  try{await fetch(url,{mode:'no-cors',cache:'no-store',signal:c.signal});return true;}
  catch(e){return false;}
  finally{clearTimeout(t);try{c.abort();}catch(e){}}
}

/* ---------- playback ------------------------------------------------------ */
function startStream(){const id=++requestId;setStatus('Подключение…');destroyHls();const fail=dead=>{if(id!==requestId)return;setStatus('Не удалось воспроизвести поток','err');toggle.textContent='▶';if(dead&&current)markBad(current,'playback');markActive();};
if(isHls(current.u)&&!audio.canPlayType('application/vnd.apple.mpegurl')){loadHlsLib().then(()=>{if(id!==requestId)return;if(!window.Hls||!Hls.isSupported()){fail(false);return;}hls=new Hls({enableWorker:true});hls.on(Hls.Events.ERROR,(_,d)=>{if(d&&d.fatal)fail(true);});hls.loadSource(current.u);hls.attachMedia(audio);hls.on(Hls.Events.MANIFEST_PARSED,()=>{audio.play().catch(()=>fail(false));});}).catch(()=>fail(false));return;}
audio.src=current.u;audio.play().catch(()=>fail(false));}
function playStation(s,idx){if(!s||!s.u)return;if(current===s&&!audio.paused){audio.pause();return;}current=s;currentIdx=idx===undefined?null:idx;nowTitle.textContent=s.n;toggle.disabled=false;startStream();markActive();}
toggle.addEventListener('click',()=>{if(!current)return;if(audio.paused)startStream();else audio.pause();});
audio.addEventListener('playing',()=>{setStatus('В эфире','ok');toggle.textContent='⏸';if(current)markOk(current);markActive();});
audio.addEventListener('waiting',()=>setStatus('Буферизация…'));
audio.addEventListener('pause',()=>{if(current)setStatus('Пауза');toggle.textContent='▶';markActive();});
audio.addEventListener('error',()=>{if(!current)return;setStatus('Ошибка потока: станция недоступна или ссылка устарела','err');toggle.textContent='▶';markBad(current,'playback');markActive();});
audio.addEventListener('ended',()=>{setStatus('Поток завершён','err');toggle.textContent='▶';markActive();});
search.addEventListener('input',renderList);
recheck.addEventListener('click',()=>checkAll({force:true}));
customBtn.addEventListener('click',()=>{let url;try{url=new URL(customUrl.value.trim());if(!['http:','https:'].includes(url.protocol))throw new Error();}catch(e){setStatus('Введите корректную ссылку, начинающуюся с http:// или https://','err');return;}playStation({n:'Свой поток',r:'вручную',u:url.href});});
customUrl.addEventListener('keydown',e=>{if(e.key==='Enter')customBtn.click();});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat&&!e.target.closest('input,textarea,select,button,[contenteditable]')&&!toggle.disabled){e.preventDefault();toggle.click();}});
renderList();
checkAll();
</script>
</body>
</html>
